# Database settings
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:schoolapp9csrpro}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:cf9user}
spring.datasource.password=${MYSQL_PASSWORD:12345}

# always set hibernate to validate that our entity classes match our database schema (flyway handles the migrations)
spring.jpa.hibernate.ddl-auto=validate

# enable if debugging sql queries is needed
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# disable flyway the first time to generate create tables (hibernate creates them)
# below is "true" by default
spring.flyway.enabled=true
# below is "classpath:db/migration" by default
spring.flyway.locations=classpath:db/migration
# important when adopting flyway in an existing database, because it's not going to be starting from scratch
spring.flyway.baseline-on-migrate=true

# Eager loading - Convenient way to fetch related entities
# by default it is set to true, allowing access to lazy-loaded relationships even after(=outside) a @Transactional service layer
#spring.jpa.open-in-view=true
# make sure to use JOIN FETCH
spring.jpa.open-in-view=false

