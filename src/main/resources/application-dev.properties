# Database settings
spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5432}/${PG_DB:cf9db}
spring.datasource.username=${PG_USER:cf9user}
spring.datasource.password=${PG_PASSWORD:12345}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema - tell Hibernate to use the specified schema
spring.jpa.properties.hibernate.default_schema=eduappschema

# always set hibernate to validate that our entity classes match our database schema (flyway handles the migrations)
spring.jpa.hibernate.ddl-auto=validate

# enable if debugging sql queries is needed
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# disable flyway the first time to generate create tables (hibernate creates them)
# below is "true" by default
spring.flyway.enabled=true
# below is "classpath:db/migration" by default
spring.flyway.locations=classpath:db/migration
# important when adopting flyway in an existing database, because it's not going to be starting from scratch
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=eduappschema

# Eager loading - Convenient way to fetch related entities
# by default it is set to true, allowing access to lazy-loaded relationships even after(=outside) a @Transactional service layer
#spring.jpa.open-in-view=true
# make sure to use JOIN FETCH
spring.jpa.open-in-view=false

app.security.secret-key=${JWT_SECRET:JIX4Ep1ZeBBcZuOypxjG51qVA7I1OTl/myYtIRfzfewm8j9/7J4BFxpw0X16Sql2}
app.security.jwt-expiration=${JWT_EXPIRATION:600000}
app.security.jwt.issuer=${JWT_ISSUER:http://localhost:8080/api}

allowed.origins=http://localhost:5173,http://localhost:3000

file.upload.dir=uploads/

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

springdoc.swagger-ui.enabled=true
